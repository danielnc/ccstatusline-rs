# Tests, lint, coverage, the differential parity harness against upstream ccstatusline, and a secret scan on every
# pull request and push to main. The `ci` job at the end is the one stable check to require in branch protection:
# it passes only if every other job passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR or to main supersedes the run before it, so only the latest commit spends runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: cargo test
        run: cargo test --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Rust that Cargo.toml's rust-version promises, read from the manifest so the two cannot drift.
      - name: Rust toolchain (rust-version from Cargo.toml)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
          rustc --version

      - name: cargo test
        run: cargo test --locked

  harness:
    name: harness (macos, ${{ matrix.part }}/4)
    # The parity gate, split over four runners, each also collecting coverage from its own instrumented build:
    # part 1 runs the unit tests and the render harness, parts 2-4 a third of the editor harness each (it is the
    # slow one). The corpus was generated on macOS and upstream picks some code paths by platform, so all of it
    # runs here.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview && rustup default stable

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      # Node's ICU decides upstream's Unicode widths, so pin the major the width tables were generated with.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned upstream ccstatusline and the TUI harness's terminal emulator
        run: |
          npm ci --prefix parity/upstream --ignore-scripts
          npm ci --prefix parity/tui --ignore-scripts

      # A failed harness fails the job, but only after this part's coverage file is written.
      - name: cargo llvm-cov (part ${{ matrix.part }})
        env:
          PART: ${{ matrix.part }}
        run: |
          eval "$(cargo llvm-cov show-env --export-prefix)" # not `source <(...)`: macOS ships bash 3.2
          cargo llvm-cov clean --workspace
          if [ "$PART" = 1 ]; then cargo test --locked; fi
          cargo build --locked
          bin="${CARGO_TARGET_DIR:-target}/debug/ccstatusline-rs"
          parity=0
          if [ "$PART" = 1 ]; then
            node parity/run.mjs -q --rust-bin "$bin" --json parity-report.json \
              || { parity=1; echo "::error::parity cases failed"; }
            sh parity/tmp-root-check.sh --rust-bin "$bin" \
              || { parity=1; echo "::error::--tmp-root removed more than the harness's own scratch"; }
          else
            node parity/tui.mjs -q --rust-bin "$bin" --shard "$((PART - 1))/3" --json "tui-parity-report-$PART.json" \
              || { parity=1; echo "::error::TUI parity cases failed"; }
          fi
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path "lcov-$PART.info"
          # Repo-relative paths, so the merge on Linux and Codecov see the same files.
          sed -i '' "s|^SF:$GITHUB_WORKSPACE/|SF:|" "lcov-$PART.info"
          exit "$parity"

      - name: Keep this part's coverage and parity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-part-${{ matrix.part }}
          path: |
            lcov-*.info
            parity-report.json
            tui-parity-report-*.json
          retention-days: 14
          if-no-files-found: ignore

  coverage:
    name: coverage
    # One report from the four parts: a line counts as covered when any part covered it.
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: harness-part-*
          path: parts
          merge-multiple: true

      - name: Merge the parts and gate line coverage
        run: python3 -I tools/lcov-merge.py --expect 4 --fail-under-lines 84 --output lcov.info parts/lcov-*.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  scripts:
    name: scripts (${{ matrix.os }})
    # tools/bench.sh against stub renderers, on BSD time (macOS) and GNU time (Linux).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: GNU time
        if: runner.os == 'Linux'
        run: test -x /usr/bin/time || { sudo apt-get update -q && sudo apt-get install -y -q time; }

      - name: tools/bench.sh
        run: sh tools/bench-check.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history, every branch and tag
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks

      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="--all" --config .gitleaks.toml .'

  ci:
    name: ci
    if: always()
    needs: [test, msrv, harness, coverage, lint, scripts, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
