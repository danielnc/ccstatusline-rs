# Tests, lint, coverage, the differential parity harness against upstream ccstatusline, and a secret scan on every
# pull request and push to main. The `ci` job at the end is the one stable check to require in branch protection:
# it passes only if every other job passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: cargo test
        run: cargo test --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Rust that Cargo.toml's rust-version promises, read from the manifest so the two cannot drift.
      - name: Rust toolchain (rust-version from Cargo.toml)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
          rustc --version

      - name: cargo test
        run: cargo test --locked

  coverage:
    name: coverage (macos)
    # Coverage counts the unit tests and the parity harness, which needs macOS and Node 24 like the parity job.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview && rustup default stable

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pinned upstream ccstatusline and the TUI harness's terminal emulator
        run: |
          npm ci --prefix parity/upstream --ignore-scripts
          npm ci --prefix parity/tui --ignore-scripts

      # One instrumented build runs the unit tests and every parity case (renders and editor), and one report
      # merges them. The parity job is the parity gate (on the release build), so a parity failure here is only a
      # warning; coverage is gated here, and uploading it can never fail CI.
      - name: cargo llvm-cov (unit tests and parity harnesses)
        run: |
          eval "$(cargo llvm-cov show-env --export-prefix)" # not `source <(...)`: macOS ships bash 3.2
          cargo llvm-cov clean --workspace
          cargo test --locked
          cargo build --locked
          bin="${CARGO_TARGET_DIR:-target}/debug/ccstatusline-rs"
          node parity/run.mjs -q --rust-bin "$bin" \
            || echo "::warning::parity cases failed against the instrumented build"
          node parity/tui.mjs -q --rust-bin "$bin" \
            || echo "::warning::TUI parity cases failed against the instrumented build"
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines 84

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  parity:
    name: parity (macos)
    # The corpus was generated on macOS and upstream picks some code paths by platform, so the harness runs there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Node's ICU decides upstream's Unicode widths, so pin the major the width tables were generated with.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Release build
        run: cargo build --release --locked

      - name: Install pinned upstream ccstatusline
        run: npm ci --prefix parity/upstream --ignore-scripts

      - name: Run the differential harness
        run: node parity/run.mjs -q --json parity-report.json

      # The editor on a pseudo-terminal, both screens read through a terminal emulator and compared cell by cell.
      - name: Install the TUI harness's terminal emulator
        run: npm ci --prefix parity/tui --ignore-scripts

      - name: Run the TUI differential harness
        run: node parity/tui.mjs -q --json tui-parity-report.json

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: |
            parity-report.json
            tui-parity-report.json
          retention-days: 14
          if-no-files-found: ignore

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history, every branch and tag
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks

      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="--all" --config .gitleaks.toml .'

  ci:
    name: ci
    if: always()
    needs: [test, msrv, coverage, lint, parity, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
