# Coverage targets (CI also gates at 84% of lines). The numbers count the unit tests and every case of the
# differential parity harness, run against one instrumented build in CI's coverage job; targets are set just under
# what that reached (84.8% of lines on macOS, October 2026) rather than relative to the base.
coverage:
  status:
    project:
      default:
        target: 84%
    patch:
      default:
        target: 84%
