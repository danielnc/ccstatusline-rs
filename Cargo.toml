[package]
name = "ccstatusline-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/danielnc/ccstatusline-rs"
readme = "README.md"
keywords = ["claude", "claude-code", "statusline", "cli", "terminal"]
publish = false
description = "Native drop-in replacement for ccstatusline (Claude Code status line)"
license = "MIT"

[[bin]]
name = "ccstatusline-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
unicode-segmentation = "1"
ryu = "1"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
